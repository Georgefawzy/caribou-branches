<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فروع كاريبو – مصر</title>
<style>
  :root{--ink:#14213d;--muted:#667085;--line:#e4e7ec;--bg:#f6f7f9;--card:#fff;--accent:#0b4f8a;--accent-soft:#e6f0fa;--ok:#0f7a4a}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--accent);color:#fff;padding:20px 16px 16px}
  header h1{margin:0;font-size:1.35rem}
  header p{margin:4px 0 0;opacity:.85;font-size:.9rem}
  main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
  .tools{display:flex;gap:8px;margin:4px 0 12px}
  input[type=search]{flex:1;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff}
  button,.btn{font:inherit;cursor:pointer}
  .near{background:var(--ok);color:#fff;border:0;border-radius:10px;padding:0 14px;font-weight:600;white-space:nowrap}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip small{opacity:.75;margin-inline-start:4px}
  .status{font-size:.88rem;color:var(--muted);margin:0 2px 10px;min-height:1.2em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .card.nearest{border-color:var(--ok);box-shadow:0 0 0 2px #0f7a4a22}
  .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .name{font-weight:700;font-size:1.05rem;direction:ltr;text-align:right}
  .tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:.78rem;white-space:nowrap}
  .dist{background:#e7f6ee;color:var(--ok);border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
  .meta{color:var(--muted);font-size:.9rem;margin-top:4px;line-height:1.6}
  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:10px;font-weight:600;font-size:.95rem}
  .btn.p{background:var(--accent);color:#fff}
  .btn.s{background:var(--accent-soft);color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>فروع كاريبو – مصر</h1>
  <p>اختار المنطقة أو دوّر على أقرب فرع ليك</p>
</header>
<main>
  <div class="tools">
    <input id="q" type="search" placeholder="ابحث باسم الفرع أو المنطقة…">
    <button class="near" id="nearBtn">📍 أقرب فرع</button>
  </div>
  <div class="chips" id="chips"></div>
  <p class="status" id="status"></p>
  <div id="list"></div>
</main>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
  let ALL = [], region = "all", query = "", here = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";

  // ---- البيانات الاحتياطية من data.js ----
  function fromDataJs(){
    const nm = id => (REGIONS.find(r => r.id === id) || {}).name || id;
    return BRANCHES.map(b => ({...b, region: nm(b.region)}));
  }

  // ---- قراءة CSV (يدعم الاقتباس والأسطر المتعددة) ----
  function parseCSV(t){
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < t.length; i++){
      const c = t[i];
      if (q){ if (c === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ","){ row.push(cur); cur = ""; }
      else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c !== "\r") cur += c;
    }
    if (cur || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function fromCSV(text){
    const rows = parseCSV(text.replace(/^\ufeff/, "")).filter(r => r.some(x => x.trim()));
    const head = rows.shift().map(h => h.trim().toLowerCase());
    return rows.map(r => {
      const o = {}; head.forEach((h, i) => o[h] = (r[i] || "").trim());
      const lat = parseFloat(o.lat), lng = parseFloat(o.lng);
      return {region: o.region, name: o.name, area: o.area, address: o.address, phone: o.phone, hours: o.hours,
              lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng, link: o.link};
    }).filter(b => b.name && b.region);
  }

  async function load(){
    ALL = fromDataJs();
    render();
    if (typeof SHEET_CSV_URL === "undefined" || !SHEET_CSV_URL) return;
    try {
      const r = await fetch(SHEET_CSV_URL, {cache: "no-store"});
      if (!r.ok) throw new Error(r.status);
      const txt = await r.text();
      const list = fromCSV(txt);
      if (!list.length) throw new Error("empty");
      ALL = list;
      try { localStorage.setItem("caribou_csv", txt); } catch(e){}
    } catch(e){
      try { const c = localStorage.getItem("caribou_csv"); if (c){ const l = fromCSV(c); if (l.length) ALL = l; } } catch(_){}
    }
    if (region !== "all" && !ALL.some(b => b.region === region)) region = "all";
    render();
  }

  function km(a, b, c, d){
    const R = 6371, r = x => x * Math.PI / 180;
    const dLat = r(c - a), dLng = r(d - b);
    const h = Math.sin(dLat/2)**2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function renderChips(){
    const names = [...new Set(ALL.map(b => b.region))];
    const items = [{id:"all", n:ALL.length}].concat(names.map(n => ({id:n, n:ALL.filter(b => b.region === n).length})));
    $("chips").innerHTML = items.map(i =>
      `<button class="chip ${i.id === region ? "on" : ""}" data-id="${esc(i.id)}">${i.id === "all" ? "الكل" : esc(i.id)}<small>${i.n}</small></button>`).join("");
    $("chips").querySelectorAll(".chip").forEach(c => c.onclick = () => { region = c.dataset.id; render(); });
  }

  function render(){
    renderChips();
    const q = query.trim().toLowerCase();
    let rows = ALL
      .map(b => ({...b, d: here && b.lat != null ? km(here.lat, here.lng, b.lat, b.lng) : null}))
      .filter(b => region === "all" || b.region === region)
      .filter(b => !q || [b.name, b.area, b.address, b.region].join(" ").toLowerCase().includes(q));
    if (here) rows.sort((a, b) => (a.d == null) - (b.d == null) || a.d - b.d);

    $("status").textContent = here ? "الفروع مرتبّة من الأقرب للأبعد حسب موقعك" : rows.length + " فرع";
    if (!rows.length){ $("list").innerHTML = '<div class="empty">مفيش نتائج</div>'; return; }

    $("list").innerHTML = rows.map((b, i) => {
      const dir = b.lat != null ? `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}` : "";
      const meta = [esc(b.address), b.area && !b.address ? esc(b.area) : "", b.phone ? "📞 " + esc(b.phone) : "", b.hours ? "🕒 " + esc(b.hours) : ""]
        .filter(Boolean).join("<br>");
      return `<div class="card ${here && i === 0 && b.d != null ? "nearest" : ""}">
        <div class="top">
          <div class="name">${esc(b.name)}</div>
          ${b.d != null ? `<span class="dist">${b.d < 1 ? Math.round(b.d * 1000) + " م" : b.d.toFixed(1) + " كم"}</span>` : `<span class="tag">${esc(b.region)}</span>`}
        </div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        <div class="actions">
          ${b.link ? `<a class="btn p" href="${safeUrl(b.link)}" target="_blank" rel="noopener">افتح في الخريطة</a>` : ""}
          ${dir ? `<a class="btn s" href="${dir}" target="_blank" rel="noopener">الاتجاهات</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  $("q").oninput = e => { query = e.target.value; render(); };

  $("nearBtn").onclick = () => {
    if (!navigator.geolocation){ $("status").textContent = "المتصفح مش بيدعم تحديد الموقع"; return; }
    $("status").textContent = "بحدد موقعك…";
    navigator.geolocation.getCurrentPosition(
      p => { here = {lat:p.coords.latitude, lng:p.coords.longitude}; region = "all"; render(); window.scrollTo({top:0, behavior:"smooth"}); },
      () => { $("status").textContent = "ماقدرتش أحدد موقعك — اسمح للموقع بالوصول لموقعك أو اختار المنطقة يدوي"; },
      {enableHighAccuracy:true, timeout:10000}
    );
  };

  load();
</script>
</body>
</html>
